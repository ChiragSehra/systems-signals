project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - writing.qmd
    - series.qmd
    - about.qmd
    - posts/

website:
  title: "Systems / Signals"
  description: "Long-form notes on AI systems, distributed software, and the machinery beneath the interface."
  site-url: https://chiragsehra.github.io/systems-signals
  favicon: assets/favicon.svg
  navbar:
    background: "#f7f5ef"
    foreground: "#18211f"
    left:
      - text: "Systems / Signals"
        href: index.qmd
    right:
      - text: Writing
        href: writing.qmd
      - text: Series
        href: series.qmd
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/ChiragSehra/systems-signals
        aria-label: GitHub repository
  page-footer:
    left: "© 2026 Systems / Signals"
    right:
      - text: RSS
        href: writing.xml
      - text: GitHub
        href: https://github.com/ChiragSehra/systems-signals
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: false
    code-copy: true
    code-overflow: scroll
    code-line-numbers: false
    html-math-method: katex
    fig-align: center
    fig-responsive: true
    link-external-newwindow: true
    anchor-sections: true
    citations-hover: true
    footnotes-hover: true
    comments:
      giscus:
        repo: ChiragSehra/systems-signals
        repo-id: R_kgDOT7NE_g
        category: Announcements
        category-id: DIC_kwDOT7NE_s4DDkzb
        mapping: pathname
        reactions-enabled: true
        input-position: bottom
        theme: preferred_color_scheme
        loading: lazy

bibliography: references.bib
author: "Chirag Sehra"
date-format: "MMMM D, YYYY"
execute:
  freeze: auto
