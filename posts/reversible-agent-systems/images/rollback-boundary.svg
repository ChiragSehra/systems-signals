<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Effect boundary</title>
  <desc id="desc">A proposed effect passes through a policy boundary before it changes external state and is recorded.</desc>
  <rect width="900" height="260" fill="#f7f5ef"/>
  <g fill="none" stroke="#1d514b" stroke-width="3">
    <rect x="42" y="88" width="190" height="84"/>
    <rect x="355" y="88" width="190" height="84"/>
    <rect x="668" y="88" width="190" height="84"/>
    <path d="M232 130h123M545 130h123"/>
    <path d="m337 120 18 10-18 10M650 120l18 10-18 10"/>
  </g>
  <g fill="#18211f" font-family="Georgia, serif" text-anchor="middle">
    <text x="137" y="121" font-size="22">Agent intent</text>
    <text x="137" y="150" font-size="15">proposed effect</text>
    <text x="450" y="121" font-size="22">Policy boundary</text>
    <text x="450" y="150" font-size="15">precondition · audit</text>
    <text x="763" y="121" font-size="22">External state</text>
    <text x="763" y="150" font-size="15">apply · observe · record</text>
  </g>
</svg>
